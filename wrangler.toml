# ==============================================================================
# CLOUDFLARE PAGES & WORKER CONFIGURATION
# Ma'had Aly DDI Mangkoso Portal
# ==============================================================================

name = "mahad-aly-ddi-mangkoso"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".next"

# ------------------------------------------------------------------------------
# CRON TRIGGER (ANTI-PAUSE SUPABASE)
# Menjalankan ping otomatis ke endpoint /api/health setiap 3 hari sekali
# agar database PostgreSQL di Supabase Free Tier tidak pernah idle/pause otomatis.
# ------------------------------------------------------------------------------
[triggers]
crons = ["0 0 */3 * *"]

[vars]
NEXT_PUBLIC_SUPABASE_URL = "https://ymxijorgoucpsxgcvtgu.supabase.co"
