# Worker cron rekap bacaan: dua jadwal UTC.
# "0 16 * * *" = pukul 00:00 WITA (snapshot tengah malam)
# "0 22 * * *" = pukul 06:00 WITA (rekap email pagi)
name = "rekap-bacaan-malam"
main = "worker.js"
compatibility_date = "2026-01-01"

[triggers]
crons = ["0 16 * * *", "0 22 * * *"]

[vars]
TARGET_URL = "https://mahadaly-ddimangkoso.ac.id/api/analytics/internal/rekap-malam"
TARGET_URL_EMAIL = "https://mahadaly-ddimangkoso.ac.id/api/analytics/internal/rekap-email"
